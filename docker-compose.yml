services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripfund
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripfund}
      POSTGRES_DB: tripfund
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripfund -d tripfund"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://tripfund:${POSTGRES_PASSWORD:-tripfund}@db:5432/tripfund
      # Set to true when the site is served over HTTPS (production).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
